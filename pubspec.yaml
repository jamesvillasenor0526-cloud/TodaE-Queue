name: toda_equeue_plus
description: "TODA E-QUEUE+ - A Geo-Fenced Queue, Booking, and Safety Management System"
publish_to: 'none'
version: 1.6.22+41

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloudinary: ^1.2.0
  http: ^1.1.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.5

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # ML Kit & Camera
  camera: ^0.11.0

  # State Management
  provider: ^6.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/baliwag_boundary.json
